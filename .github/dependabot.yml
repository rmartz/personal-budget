version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # NOTE: Do NOT add a `cooldown` to any ecosystem in this file. Cooldown was
    # tried and deliberately removed — it added friction without meeting its goal:
    #   * npm/pnpm: Dependabot enforces cooldown by passing pnpm a
    #     `minimumReleaseAge`; during lockfile regeneration pnpm hard-fails with
    #     ERR_PNPM_NO_MATURE_MATCHING_VERSION whenever any transitive dependency in
    #     the fast-moving Storybook/Vite toolchain is inside the window, instead of
    #     falling back to an older mature one. That breaks the lockfile step, the
    #     grouped update fails with `unknown_error`, and the PR is closed as
    #     `update_no_longer_possible`. A cooldown here left npm updates broken for
    #     weeks (no grouped npm PR merged 2026-07-12 -> 2026-08-30 while 20 vuln
    #     alerts piled up). Because Dependabot always resolves to latest, a freshness
    #     policy cannot coexist with it.
    #   * A cooldown also does not actually deliver freshness: Dependabot keeps its
    #     PRs current, so even an older pinned release still pulls transitive
    #     dependencies that can be inside the window — exactly the exposure a
    #     cooldown is meant to avoid.
    #   * github-actions: supply-chain risk is already mitigated by full commit-SHA
    #     pinning (enforced by check-action-pins.mjs / the Action Pins workflow), so
    #     a re-pointed mutable tag cannot reach CI. The cooldown only delayed every
    #     action bump without adding protection the SHA pins don't already give.
    commit-message:
      prefix: "chore"
      include: "scope"
    # Version-locked families (first below) group interdependent packages so they
    # bump atomically instead of scattering into separate PRs — chiefly for
    # majors, which break the build if split (each family's note below states how
    # far it scopes: same-tier families group majors only, while react spans both
    # tiers and groups every update type). Otherwise, group only minor and patch
    # bumps into one batched PR per dependency type; non-family major bumps match
    # no group and raise individual PRs, since they more often need code changes
    # and warrant isolated review.
    groups:
      # Version-locked families. Each is a set of packages that ship on a shared
      # version line (or whose majors are dictated by one member), so a major bump
      # to one without the rest breaks the build. Listed first to win
      # group-assignment precedence, so a family major lands as one atomic PR
      # instead of scattered individual PRs.
      #
      # Scope by tier: a family whose members are ALL dev (or all prod) only groups
      # MAJORS (`update-types: [major]`) — its minor/patch bumps already batch in
      # lockstep via the dev-dependencies / production-dependencies groups below, so
      # grouping them here too would just split routine churn into extra PRs. The
      # react family is the exception: it spans prod (react, react-dom) and dev
      # (@types), so its minor/patch would otherwise scatter across the two tier
      # groups — it stays unrestricted (all update types) to keep the four together.
      react:
        # react + react-dom ship the same version and must move together; the
        # @types track react's major. Spans prod + dev, so — unlike the same-tier
        # families below — it groups every update type, not just majors.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      storybook:
        # Every @storybook/* package, the storybook CLI, and the eslint plugin
        # share one Storybook version line. Listed before eslint and vite so
        # eslint-plugin-storybook and @storybook/nextjs-vite / addon-vitest join
        # here rather than those groups.
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
        update-types:
          - "major"
      vite:
        # vite + its react plugin + vitest + @vitest/* are one interlocked
        # toolchain: a vite major dictates the plugin and vitest majors (the
        # @vitejs/plugin-react <-> vite coupling that forced the Vite 8 -> 7 pin,
        # #360), so they must bump together as one atomic PR.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      eslint:
        # eslint + @eslint/js share a version line; typescript-eslint and the
        # react-hooks plugin track the eslint major.
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "eslint-plugin-react-hooks"
        update-types:
          - "major"
      tailwind:
        # tailwindcss core + its postcss plugin ship in lockstep; a mismatch
        # fails the build.
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "major"
      # Prettier (and its plugins) gets its own group for major/minor bumps so a
      # formatting-affecting upgrade lands in an isolated PR — a Prettier minor
      # bump can reformat the whole tree and require code changes, which must not
      # be buried in a batched dev-dependencies PR. Listed first to win
      # group-assignment precedence (a dependency joins the first group whose
      # patterns AND update-types match). Patch bumps are intentionally excluded
      # here, so trivial Prettier patches fall through to the dev-dependencies
      # group and ride along with the routine batch.
      prettier:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
        update-types:
          - "major"
          - "minor"
      # TypeScript is the language itself, not just another dependency — a
      # compiler major or minor can surface new type errors across the codebase
      # and warrants isolated, visible review, so split those into their own PR
      # (like prettier). The exact `typescript` pattern does not claim
      # typescript-eslint, which stays in the eslint family. Patch bumps fall
      # through to dev-dependencies and ride the routine batch.
      typescript:
        patterns:
          - "typescript"
        update-types:
          - "major"
          - "minor"
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"

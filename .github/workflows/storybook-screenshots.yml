name: Storybook Screenshots

# Advisory per-PR screenshot gallery, delegated to the shared rmartz/storybook-ci
# reusable workflow (issue #471). It builds Storybook, screenshots the stories a
# PR's changes touch, and posts them as one update-in-place PR comment.
#
# This replaces pr-screenshots.yml, .github/scripts/storybook-screenshots.mjs, and
# pr-screenshots-cleanup.yml. The gallery images are now GitHub user-attachments
# uploaded by `gh --attach` rather than blobs force-pushed to a per-PR orphan
# branch (gh-screenshots-pr-<N>), so there is no branch to tear down and this
# caller needs no `contents: write`.
#
# The advisory isolation (`continue-on-error`), per-PR concurrency, fork skip,
# capture deadline, and story resolution all live in the shared workflow, so no
# `concurrency` or `continue-on-error` block belongs here.
#
# `secrets: inherit` forwards STORYBOOK_SCREENSHOT_PAT, required because the
# user-attachments upload endpoint rejects the Actions GITHUB_TOKEN. A preflight
# step runs before the expensive Storybook build: when the PAT is missing or
# invalid it posts one non-blocking advisory PR comment and skips the build and
# capture, so a misconfigured PAT announces itself instead of looking like
# success. That is why this caller can land before the secret exists. The whole
# job is skipped on fork PRs so the PAT never reaches fork-authored code.
#
# This is advisory and never a required check, so unlike storybook-tests.yml it
# may safely use an `on.paths` filter to stay off unrelated PRs. The filter is
# `src/**` rather than only `*.stories.tsx` because the shared default resolver is
# `colocation`: a component edited without touching its story now regenerates the
# co-located story's screenshot, which is the false negative the previous
# changed-stories-only gate had.

on:
  pull_request:
    paths:
      - "src/**"
      - ".storybook/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    uses: rmartz/storybook-ci/.github/workflows/storybook-screenshots.yml@731dada2cdeb712b5443c4e2b29a3065f90ffd81 # v1.2.1
    secrets: inherit

name: bot-automerge

# Enables GitHub-native auto-merge for the low-impact bot PRs we trust —
# Dependabot patch/minor bumps and release-please release PRs — so they land
# without hand-holding once every required check goes green. Human PRs are
# unaffected: bot-automerge only makes a bot PR *eligible*; the repo's required
# status checks (CI gates + the required `merge-safety` check-run) are what it
# waits on. It posts no check-run of its own. See rmartz/bot-automerge-action.
#
# This uses the rmartz/bot-automerge-action composite action, the successor to the
# @rmartz/bot-automerge reusable workflow. A composite action cannot declare its
# own triggers or use `secrets: inherit`, so this caller owns the trigger and
# permissions and runs the action as a job step.
#
# pull_request_target (not pull_request): Dependabot PRs run with a read-only
# token, and enabling auto-merge needs base-context write. It never runs PR code —
# it only classifies the PR and calls `gh pr merge --auto`, using the
# BOT_AUTOMERGE_TOKEN real-actor PAT: a merge enabled with GITHUB_TOKEN fires no
# push workflows, so a bot merge would reach main with no CI or deploy run.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable auto-merge on the PR
  pull-requests: write # read PR metadata / classify

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of checking out and installing the CLI just to no-op.
    # The two conditions mirror the CLI's own detectBotPrType exactly —
    # Dependabot by author, release-please by head branch prefix — so nothing
    # eligible is skipped. The `autorelease: pending` label is not a signal: since
    # v2.0.0 the CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    # It is deliberately not an author test: release-please run under a PAT
    # authors its release PR as that real user, not a [bot] account, so an
    # author-only guard would skip release PRs.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rmartz/bot-automerge-action@a67b7de61ed8b20964ed4b8e4f2fd0aa43d00113 # v2.1.5
        with:
          pr: ${{ github.event.pull_request.number }}
          # Real-actor PAT, stored as both an Actions and a Dependabot secret (a
          # Dependabot-triggered run sees only the latter). An auto-merge enabled
          # with GITHUB_TOKEN fires no push workflows, so a bot merge would reach
          # main with no push-triggered CI, release, or merge-safety run
          # (rmartz/bot-automerge-action#31). When the secret is unset the action
          # falls back to GITHUB_TOKEN itself.
          token: ${{ secrets.BOT_AUTOMERGE_TOKEN }}

name: Storybook Tests

# Gating Storybook CI, delegated to the shared rmartz/storybook-ci reusable
# workflow (issue #471). It runs the Vitest browser-mode story suite in real
# Chromium (`storybook-tests / Storybook Tests`) and the production Storybook
# build plus its canary render check (`storybook-tests / Storybook Build`).
#
# Everything this repo used to hand-roll for those jobs — Chromium provisioning
# and binary caching with a retry, the docs-only change denylist, telemetry
# opt-out — now lives in the shared workflow. The test job uses the shared
# defaults (`pnpm exec vitest run --project storybook` matches the `storybook`
# project in vitest.config.mts, and Node 24.x matches ./.github/actions/setup).
#
# The build job is configured, not defaulted: after `pnpm build-storybook` it
# runs scripts/check-storybook-render.mjs, which renders Redux-connected canary
# stories from the *built* bundle in real Chromium to guard the Vite/Rolldown
# reselect regression (#359). `build-needs-browser: true` has the shared build
# job provision the same cached Playwright Chromium the test job uses, so the
# render check can launch it. See docs/storybook-ci.md.
#
# The `@<sha>` pin is kept current by Dependabot's github-actions ecosystem, which
# reads the trailing `# vX.Y.Z` comment to map the SHA to a release — so that
# comment is required, not decorative.
#
# Required-check note: gating is the reusable workflow's `detect-changes` job plus
# a per-job `if:`, NOT an `on.paths` filter. A job skipped by an `if:` counts as
# passing, but a required check that never runs because its paths did not match
# hangs the PR forever. Do not add `paths` here.

on:
  pull_request:
  push:
    branches: ["main"]

# `packages: read` is required by the shared workflow (a called workflow can only
# narrow the caller's grant, never widen it).
permissions:
  contents: read
  packages: read

jobs:
  storybook-tests:
    uses: rmartz/storybook-ci/.github/workflows/storybook-tests.yml@ff758949491f6d22298273b424dd79144c5dd543 # v1.5.2
    with:
      build-needs-browser: true
      build-command: pnpm build-storybook && node scripts/check-storybook-render.mjs

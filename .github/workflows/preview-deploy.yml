name: Preview Deploy

# Label-driven Vercel preview deploy via the shared rmartz/vercel-preview-ci
# reusable workflow. A PR gets a preview only while it carries `UAT ready` (the
# legacy `ready for UAT` is also accepted during the fleet rename); it is
# redeployed on each new push and the URL is posted as a sticky PR comment. The
# gate, fork safety, and per-PR concurrency live in the shared workflow:
# https://github.com/rmartz/vercel-preview-ci/blob/main/docs/consuming.md
#
# This is the sole preview path: vercel.json's `git.deploymentEnabled` disables
# Vercel's Git-integration deploys for every branch except `main`.
#
# Each UAT deploy is also aliased to the stable staging host, so the most
# recently deployed `UAT ready` PR is the one served there. The staging domain is
# connected to the placeholder `staging` branch in Vercel (never deployed) rather
# than left unassigned, so production deploys never claim it and it stays behind
# preview deployment protection.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  preview:
    # `[WIP]`-titled PRs are held as unfinished work and get no preview. The
    # shared workflow gates on draft status but not the title, so it is kept here.
    if: ${{ !contains(github.event.pull_request.title, '[WIP]') }}
    uses: rmartz/vercel-preview-ci/.github/workflows/vercel-preview.yml@e4b2c3d6e1edfd0412c68c7b8e930d190edb0909 # v1.1.0
    with:
      alias-domain: staging.budget.reedmartz.com
    secrets: inherit

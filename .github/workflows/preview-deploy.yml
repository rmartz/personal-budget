name: Preview Deploy

# Vercel preview deploy via the shared rmartz/vercel-preview-ci reusable
# workflow. A PR gets a preview when its title has a functional Conventional
# Commit type (`feat`, `fix`, `perf`, `revert`) or it carries `preview`;
# `no preview` and `do not merge` always skip, and Dependabot PRs need
# `preview`. It is redeployed on each new push and the URL is posted as a sticky
# PR comment. The gate, fork safety, and per-PR concurrency live in the shared
# workflow:
# https://github.com/rmartz/vercel-preview-ci/blob/main/docs/gating.md
#
# This is the sole preview path: vercel.json's `git.deploymentEnabled` disables
# Vercel's Git-integration deploys for every branch except `main`.
#
# Each preview is also aliased to its own host, pr-<N>.preview.budget.reedmartz.com,
# so every PR has a stable address under a domain we own (Firebase's authorized
# domains and Google sign-in accept it) and the hostname itself says which PR it
# serves. The `*.preview.budget.reedmartz.com` domain is connected to the
# placeholder `staging` branch in Vercel (never deployed) rather than left
# unassigned, so production deploys never claim it and it stays behind preview
# deployment protection. The bare staging host belongs to the `main` deploy in
# staging-deploy.yml.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  preview:
    # `[WIP]`-titled PRs are held as unfinished work and get no preview. The
    # shared workflow does not gate on the title marker, so it is kept here.
    if: ${{ !contains(github.event.pull_request.title, '[WIP]') }}
    uses: rmartz/vercel-preview-ci/.github/workflows/vercel-preview.yml@52dca86876bf76f85b11a8fe0365879ab7e0f110 # v3.0.0
    with:
      alias-domain: pr-${{ github.event.pull_request.number }}.preview.budget.reedmartz.com
    secrets: inherit

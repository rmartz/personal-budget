name: Docs

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # Whether this PR touches a docs/ file or the validator itself. An allowlist is
  # safe because the check's verdict is a pure function of the docs/ tree — the
  # validator walks the whole tree, so any add/edit/rename/delete of a docs file
  # re-triggers it. On push it is always true.
  detect-changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_changed=false
          while IFS= read -r file; do
            case "$file" in
              docs/* | scripts/check-docs.mjs)
                docs_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"

  check-docs:
    name: Check docs OKF frontmatter and index reachability
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pure Node script (no dependencies), so it runs on the runner's built-in
      # Node without the pnpm-install setup step.
      - run: node scripts/check-docs.mjs
